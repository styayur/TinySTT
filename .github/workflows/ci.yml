name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all --all-features
      - name: Release build
        run: cargo build --release

  build:
    name: build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Release build evidence
        run: cargo build --release

  test:
    name: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test evidence
        run: cargo test --all --all-features

  security:
    name: security scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare official advisory database
        run: |
          git clone --depth 1 https://github.com/RustSec/advisory-db.git "$RUNNER_TEMP/advisory-db"
          python3 scripts/normalize_rustsec_db.py --db "$RUNNER_TEMP/advisory-db" --output security/normalization.json
      - name: Audit Rust dependencies
        shell: bash
        run: |
          set -o pipefail
          cargo install cargo-audit --locked --version 0.21.2
          cargo audit --no-fetch --db "$RUNNER_TEMP/advisory-db" 2>&1 | tee security/cargo-audit.txt
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-stt-security-evidence
          path: security/
          if-no-files-found: warn
